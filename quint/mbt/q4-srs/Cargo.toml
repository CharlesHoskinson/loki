[package]
name = "loki-q4-srs-mbt"
version = "0.1.0"
edition = "2021"
publish = false
description = "quint-q4: model-based replay of the pinned W13 GPU SRS cache code"

# Standalone test crate; not a member of any parent workspace.
[workspace]

[dependencies]
anyhow = "1"
blst = "0.3.16"
ff = "0.13"
group = "0.13"
itf = "0.4"
midnight-curves = "0.3.1"
loki-cuda-runtime = { path = "../../../cuda-runtime" }
num-bigint = "0.4"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
quint-connect = { git = "https://github.com/informalsystems/quint-connect", rev = "4f018f54fc7dd4cef341d10111427bab59d3b307" }
sppark = { version = "0.1.16", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
# Conditional-compilation names used by the pinned source.
cuda = []
cuda-srs-registry = ["cuda"]
# Link the pinned real cuda/msm.cu + sppark instead of the CPU FFI surrogate.
gpu = ["dep:sppark", "dep:cc"]
