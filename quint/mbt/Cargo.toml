[package]
name = "loki-quint-mbt"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
tempfile = "3"
blake2b_simd = "1"
itf = "0.4"
midnight-proofs = { path = "../..", features = ["circuit-params"] }
midnight-curves = "0.3.1"
ff = "0.13"
group = "0.13"
rand_chacha = "0.3"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quint-connect = { git = "https://github.com/informalsystems/quint-connect", rev = "4f018f54fc7dd4cef341d10111427bab59d3b307" }

[features]
w4-source = ["cuda", "dep:blst", "dep:num-bigint", "dep:tracing"]
cuda = []
w6-source = ["loki-key-cache", "dep:midnight-zk-stdlib", "dep:midnight-circuits", "dep:hex", "dep:sha2", "dep:rand"]
loki-key-cache = []

[dependencies.blst]
version = "0.3.16"
optional = true

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.num-bigint]
version = "0.4"
optional = true

[dependencies.midnight-zk-stdlib]
version = "=2.3.5"
optional = true

[dependencies.midnight-circuits]
version = "=7.2.4"
optional = true

[dependencies.hex]
version = "0.4"
optional = true

[dependencies.sha2]
version = "0.10"
optional = true

[dependencies.rand]
version = "0.8"
optional = true

[patch.crates-io]
midnight-proofs = { path = "../.." }
