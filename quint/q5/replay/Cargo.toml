[package]
name = "loki-q5-replay"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
# Turn on the opt-in sorted leftover traversal in the Loki main dependency.
det = ["loki/loki-deterministic-lookup-order"]

[dependencies]
loki = { package = "midnight-proofs", path = "../../.." }
stock = { package = "midnight-proofs", version = "=0.8.3" }
midnight-curves = "0.3.1"
ff = "0.13"
group = "0.13"
rand_chacha = "0.3"
rand_core = "0.6"
rayon = "1.10"
blake2b_simd = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
quint-connect = { git = "https://github.com/informalsystems/quint-connect", rev = "4f018f54fc7dd4cef341d10111427bab59d3b307" }

[profile.release]
debug-assertions = false
overflow-checks = true

[profile.test]
debug-assertions = false
opt-level = 3
