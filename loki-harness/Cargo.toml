[package]
name = "loki-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
# Real Loki feature forwarding. An accelerator feature here makes the gate
# require positive dispatch and zero fallback/error counters (src/lib.rs);
# compiling with it is not a GPU pass by itself.
cuda = ["loki/cuda"]
cuda-ntt = ["loki/cuda-ntt"]
cuda-srs-registry = ["cuda", "loki/cuda-srs-registry"]
cuda-argument-commit = ["cuda", "loki/cuda-argument-commit"]
loki-sppark = ["loki/loki-sppark"]
loki-profile = ["loki/loki-profile"]
loki-multiopen = ["loki/loki-multiopen"]
# Deliberately NOT forwarded: loki-cpu-budget. This crate links Loki and the
# stock oracle in one build, so blst/no-threads would unify into stock.
# P1 seam: new Apache-2.0 backend (forwards loki-gpu/cuda). Compiling this
# feature is not a GPU pass; GPU gates must assert backend dispatch counters.
loki-gpu-backend = ["loki/loki-gpu-backend"]
loki-cpu-budget = ["loki/loki-cpu-budget"]

[dependencies]
loki = { package = "midnight-proofs", path = ".." }
stock = { package = "midnight-proofs", version = "=0.8.3" }
midnight-curves = "0.3.1"
ff = "0.13"
blake2b_simd = "1"
rand_chacha = "0.3"
rand_core = "0.6"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
