[package]
name = "loki-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
# Once W4 lands, replace this with cuda = ["loki/cuda"].
cuda = []
loki-multiopen = ["loki/loki-multiopen"]

[dependencies]
loki = { package = "midnight-proofs", path = ".." }
stock = { package = "midnight-proofs", version = "=0.8.3" }
midnight-curves = "0.3.1"
ff = "0.13"
blake2b_simd = "1"
rand_chacha = "0.3"
rand_core = "0.6"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
