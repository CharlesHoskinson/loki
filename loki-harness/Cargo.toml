[package]
name = "loki-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
cuda = ["loki/cuda"]
cuda-srs-registry = ["cuda", "loki/cuda-srs-registry"]
loki-multiopen = ["loki/loki-multiopen"]
# P1 seam: new Apache-2.0 backend (forwards loki-gpu/cuda). Compiling this
# feature is not a GPU pass; GPU gates must assert backend dispatch counters.
loki-gpu-backend = ["loki/loki-gpu-backend"]

[dependencies]
loki = { package = "midnight-proofs", path = ".." }
stock = { package = "midnight-proofs", version = "=0.8.3" }
midnight-curves = "0.3.1"
ff = "0.13"
blake2b_simd = "1"
rand_chacha = "0.3"
rand_core = "0.6"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
