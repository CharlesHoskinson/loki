<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title id="t">Loki inside the Sherlock chain</title>
  <desc id="d">Leaf, parent and decider proofs are made by Loki inside create_proof. The documented Loki fixtures pass the stock verifier. Moriarty orchestration is outside create_proof.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8296b0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="600" rx="12" fill="#0d1729"/>
  <text x="30" y="35" font-size="18" font-weight="700" fill="#f4ecda">Loki inside the Sherlock chain</text>

  <rect x="30" y="60" width="1180" height="90" rx="10" fill="#12203a" stroke="#2a3a5a" stroke-width="1.5"/>
  <text x="50" y="94" font-size="16" font-weight="700" fill="#f4ecda">Moriarty / Sherlock orchestration (outside create_proof)</text>
  <text x="50" y="124" font-size="13" fill="#b9c3d4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cost_model · setup_pk · child verification · pairing checks</text>

  <g fill="none" stroke="#2a3a5a" stroke-width="1.3" marker-end="url(#arrow)">
    <path d="M108,150 V264"/>
    <path d="M362,150 V264"/>
    <path d="M616,150 V264"/>
  </g>
  <text x="126" y="195" font-size="12" fill="#8296b0">inputs, keys, checks</text>

  <g fill="none" stroke="#2a3a5a" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M186,298 H282"/>
    <path d="M440,298 H536"/>
    <path d="M694,298 H798"/>
    <path d="M986,298 H1078"/>
  </g>
  <g font-size="12" fill="#b9c3d4" text-anchor="middle">
    <text x="235" y="252">proof + VK</text>
    <text x="489" y="252">proof + VK</text>
    <text x="747" y="252">decider proof</text>
    <text x="1033" y="252">accepted</text>
  </g>

  <g fill="#12203a" stroke="#2fbf71" stroke-width="1.5">
    <rect x="30" y="266" width="156" height="64" rx="10"/>
    <rect x="284" y="266" width="156" height="64" rx="10"/>
