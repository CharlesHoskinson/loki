    <text x="108" y="304" font-size="16">Leaf proof</text>
    <text x="362" y="304" font-size="16">Parent proof</text>
    <text x="616" y="304" font-size="16">Decider proof</text>
    <text x="893" y="303" font-size="13">Stock 0.8.3 verifier</text>
    <text x="1145" y="303" font-size="12">Midnight ledger</text>
  </g>

  <g stroke="#2a3a5a" stroke-width="1.3">
    <path d="M108,330 V370"/>
    <path d="M362,330 V370"/>
    <path d="M616,330 V370"/>
