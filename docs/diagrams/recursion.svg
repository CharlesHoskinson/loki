  <text x="362" y="516" text-anchor="middle" font-size="12" fill="#b9c3d4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">P1 seam and P2 runtime are on main; GPU ops unsupported</text>

  <text x="30" y="560" font-size="12" fill="#8296b0">The leaf, parent and decider roles follow the loki-gpu design notes.</text>
