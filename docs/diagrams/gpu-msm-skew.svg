    <rect x="544" y="289" width="20" height="55" rx="3"/>
  </g>
  <g fill="#2fbf71">
    <rect x="676" y="340" width="20" height="4" rx="2"/>
    <rect x="708" y="338" width="20" height="6" rx="2"/>
    <rect x="740" y="341" width="20" height="3" rx="1.5"/>
    <rect x="772" y="340" width="20" height="4" rx="2"/>
    <rect x="804" y="339" width="20" height="5" rx="2"/>
    <rect x="836" y="341" width="20" height="3" rx="1.5"/>
    <rect x="868" y="340" width="20" height="4" rx="2"/>
