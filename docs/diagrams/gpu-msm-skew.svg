    <rect x="1124" y="340" width="20" height="4" rx="2"/>
    <rect x="1156" y="341" width="20" height="3" rx="1.5"/>
  </g>
  <rect x="900" y="163" width="20" height="181" rx="3" fill="#e85d2c"/>
  <g fill="none" stroke="#8296b0" stroke-width="1.3" marker-end="url(#arrow-steel)">
    <path d="M56,345 H580"/>
    <path d="M668,345 H1192"/>
  </g>
  <g font-size="13" fill="#8d9bb3" text-anchor="middle">
    <text x="314" y="371">buckets in one window</text>
    <text x="926" y="371">buckets in one window</text>
  </g>
  <text x="48" y="410" font-size="14" fill="#f4ecda">points spread over many buckets</text>
  <text x="660" y="405" font-size="14" fill="#f4ecda"><tspan x="660" dy="0">one bucket gets most of the points,</tspan><tspan x="660" dy="21">so one thread adds them one after another</tspan></text>
  <rect x="48" y="442" width="152" height="32" rx="8" fill="#0d1729" stroke="#2fbf71"/>
  <text x="124" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#2fbf71">about 25 ms</text>
  <rect x="660" y="442" width="176" height="32" rx="8" fill="#0d1729" stroke="#e85d2c"/>
  <text x="748" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#e85d2c">about 2,419 ms</text>

  <rect x="24" y="512" width="1192" height="78" rx="10" fill="#0a1222" stroke="#e3b84e"/>
  <rect x="24" y="527" width="4" height="48" rx="2" fill="#e3b84e"/>
  <text x="48" y="541" font-size="16" font-weight="700" fill="#e3b84e">Effect in the A3 parent: lookup_prepare 21.6 s on CPU, 51.4 s on GPU</text>
  <text x="48" y="569" font-size="13" fill="#8d9bb3">Source: wiki-llm/lessons/prover-performance.md (W10). Planned fix: skew-robust MSM, loki-gpu package P6.</text>
  <text x="24" y="619" font-size="13" fill="#8d9bb3">Bar heights are illustrative, not measured.</text>
</svg>
