<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Why repeated scalars slow the GPU MSM</title>
  <desc id="desc">points spread over many buckets; one bucket gets most of the points, so one thread adds them one after another. Bar heights are illustrative, not measured.</desc>
  <defs>
    <marker id="arrow-steel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8296b0"/>
    </marker>
  </defs>
  <rect width="1240" height="640" rx="12" fill="#0d1729"/>
  <text x="24" y="40" font-size="18" font-weight="700" fill="#f4ecda">Why repeated scalars slow the GPU MSM</text>
  <text x="24" y="68" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8d9bb3">sppark Pippenger: one thread per (window, bucket). Warm k18 synthetic, W10 measurement</text>

  <rect x="24" y="96" width="580" height="396" rx="12" fill="#0a1222" stroke="#2a3a5a"/>
  <rect x="636" y="96" width="580" height="396" rx="12" fill="#0a1222" stroke="#2a3a5a"/>
  <text x="48" y="130" font-size="16" font-weight="700" fill="#f4ecda">Random scalars</text>
  <text x="660" y="130" font-size="16" font-weight="700" fill="#f4ecda">Repeated scalars (lookup and permutation columns)</text>

  <!-- Both histograms use the same baseline and drawing area. -->
  <g fill="#2fbf71">
