<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Loki feature-flag graph</title>
<desc id="d">Cargo feature dependencies. Solid green nodes are declared on Loki main. Dashed violet nodes remain planned or in progress. loki-gpu-backend excludes cuda and cuda-ntt, enforced by a compile-time guard.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8296b0"/></marker>
  <marker id="planned-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a58bd9"/></marker>
  <marker id="cross" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M2 2 L10 10 M2 10 L10 2" fill="none" stroke="#e85d2c" stroke-width="1.8"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="760" rx="12" fill="#0d1729"/>
<rect x="1" y="1" width="1238" height="758" rx="12" fill="none" stroke="#2a3a5a"/>
<text x="30" y="36" font-size="18" font-weight="700" fill="#f4ecda">Loki feature-flag graph</text>
<path d="M30 53 H1210 M710 66 V691" fill="none" stroke="#2a3a5a"/>

<!-- Main enable edges. -->
<g fill="none" stroke="#2a3a5a" stroke-width="1.5" marker-end="url(#arrow)">
  <path d="M160 101 H240"/>
  <path d="M230 181 H400"/>
  <path d="M425 197 V220 H90 V245"/>
  <path d="M440 197 V230 H210 V245"/>
  <path d="M480 197 V210 H600 V405"/>
  <path d="M400 321 H280 V365"/>
  <path d="M360 381 H420 V421 H450"/>
  <path d="M220 461 H270"/>
</g>

<!-- P1 enable edges on main, routed to the right-hand panel. -->
<g fill="none" stroke="#2a3a5a" stroke-width="1.5" marker-end="url(#arrow)">
  <path d="M850 180 V74 H1030 V90"/>
  <path d="M730 199 H655 V174 H500"/>
  <path d="M730 219 H635 V314 H515"/>
  <path d="M1110 285 V256 H1192 V117 H1180"/>
  <path d="M1090 339 V390"/>
</g>

<!-- Planned enable edges; cross-panel routes enter the CUDA flags from the right. -->
<g fill="none" stroke="#a58bd9" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#planned-arrow)">
  <path d="M730 591 H684 V147 H472 V165"/>
  <path d="M1200 591 H1210 V66 H1110 V90"/>
  <path d="M730 658 H720 V359 H950 V339"/>
</g>

<!-- Conflict routes occupy their own horizontal lane and terminate in crosses. -->
<g fill="none" stroke="#e85d2c" stroke-width="1.6" stroke-dasharray="6 4">
  <path d="M910 310 H702 V270 H550"/>
  <path d="M550 270 V190 H505" marker-end="url(#cross)"/>
  <path d="M550 270 V328 H520" marker-end="url(#cross)"/>
</g>
<rect x="550" y="478" width="150" height="22" rx="6" fill="#0d1729"/>
<text x="625" y="494" text-anchor="middle" font-size="12" fill="#e85d2c">compile_error guard</text>

<!-- Flags on main. -->
<g fill="#12203a" stroke="#2fbf71" stroke-width="1.5">
  <rect x="40" y="85" width="120" height="32" rx="14"/>
  <rect x="240" y="85" width="230" height="32" rx="14"/>
  <rect x="40" y="165" width="190" height="32" rx="14"/>
