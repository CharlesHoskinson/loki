  <text x="210" y="266">cc</text>
  <text x="280" y="386">loki-cuda-ntt</text>
  <text x="555" y="426">loki-cuda-runtime</text>
  <text x="355" y="466">blst/no-threads</text>
</g>

<text x="40" y="589" font-size="12" fill="#8296b0">stock features, unchanged</text>
<g fill="#12203a" stroke="#2a3a5a" stroke-width="1.3">
  <rect x="40" y="607" width="200" height="32" rx="14"/>
  <rect x="255" y="607" width="155" height="32" rx="14"/>
  <rect x="425" y="607" width="145" height="32" rx="14"/>
  <rect x="40" y="653" width="120" height="32" rx="14"/>
  <rect x="175" y="653" width="160" height="32" rx="14"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b9c3d4" text-anchor="middle">
