  <rect x="215" y="520" width="140" height="32" rx="14"/>
  <rect x="380" y="520" width="150" height="32" rx="14"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f4ecda" text-anchor="middle">
  <text x="100" y="106">default</text>
  <text x="355" y="106">committed-instances</text>
  <text x="135" y="186">cuda-srs-registry</text>
  <text x="450" y="186">cuda</text>
