<g fill="#1a1830" stroke="#a58bd9" stroke-width="1.5" stroke-dasharray="6 4">
  <rect x="920" y="90" width="260" height="54" rx="14" stroke="#2fbf71" stroke-dasharray="none"/>
  <rect x="730" y="180" width="245" height="54" rx="14" stroke="#2fbf71" stroke-dasharray="none"/>
  <rect x="910" y="285" width="280" height="54" rx="14" stroke="#2fbf71" stroke-dasharray="none"/>
  <rect x="960" y="390" width="240" height="54" rx="14" stroke="#2fbf71" stroke-dasharray="none"/>
  <rect x="730" y="470" width="470" height="54" rx="14" stroke="#2fbf71" stroke-dasharray="none"/>
  <rect x="730" y="565" width="250" height="54" rx="14"/>
  <rect x="990" y="565" width="210" height="54" rx="14"/>
  <rect x="730" y="635" width="470" height="66" rx="14"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f4ecda" text-anchor="middle">
  <text x="1050" y="112">loki-backend-api</text>
  <text x="852.5" y="202">loki-sppark</text>
  <text x="1050" y="307">loki-gpu-backend</text>
  <text x="1080" y="412">loki-gpu</text>
  <text x="965" y="492">loki-deterministic-lookup-order</text>
  <text x="855" y="587">cuda-argument-commit</text>
  <text x="1095" y="587">loki-argument-commit</text>
  <text x="965" y="654" font-size="12"><tspan x="965">loki-gpu-srs-registry, cuda-resident, cuda-quotient, </tspan><tspan x="965" dy="17">cuda-msm-balanced, cuda-lookup-prepare</tspan></text>
</g>
<g font-size="12" fill="#a58bd9" text-anchor="middle">
  <text x="1050" y="132" fill="#2fbf71">main, P1</text>
  <text x="852.5" y="222" fill="#2fbf71">main, P1</text>
  <text x="1050" y="327" fill="#2fbf71">main, P1; GPU ops unsupported</text>
  <text x="1080" y="432" fill="#2fbf71">main, P2 runtime at d71b7ca</text>
  <text x="965" y="512" fill="#2fbf71">main, P1; opt-in</text>
  <text x="855" y="607">W10 branch; depends on cuda</text>
  <text x="1095" y="607">proposed flag, not on main</text>
  <text x="965" y="690">plan only</text>
</g>

