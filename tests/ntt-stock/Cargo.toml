[package]
name = "loki-ntt-stock-check"
version = "0.1.0"
edition = "2021"
publish = false

[features]
gpu = ["loki/cuda-ntt", "dep:loki-cuda-ntt"]

[dependencies]
loki = { package = "midnight-proofs", path = "../.." }
stock = { package = "midnight-proofs", version = "=0.8.3" }
loki-cuda-ntt = { path = "../../cuda-ntt", optional = true }
midnight-curves = "0.3.1"
rand_core = { version = "0.6", features = ["getrandom"] }
blake2b_simd = "1"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
